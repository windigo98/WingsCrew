<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>T-shirt review — Crew Lab</title>
    <meta name="robots" content="noindex" />
    <meta
      name="description"
      content="Unlisted WingsCrew page for reviewing t-shirt designs one at a time."
    />
    <meta name="theme-color" content="#0b0a09" />
    <link rel="icon" href="../../assets/brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../../assets/brand/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../../assets/brand/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,560;0,9..144,650;1,9..144,560&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/styles.css" />
    <link rel="stylesheet" href="../../assets/tshirt-review.css" />
  </head>
  <body class="tshirt-page">
    <a class="skip" href="#main">Skip to content</a>
    <header class="site-header" id="top">
      <div class="wrap bar">
        <a class="brand" href="../../">
          <picture>
            <source srcset="../../assets/brand/logo.webp" type="image/webp" />
            <img
              class="brand-logo"
              src="../../assets/brand/logo.png"
              width="532"
              height="720"
              alt="WingsCrew"
            />
          </picture>
          <span aria-hidden="true">WingsCrew</span>
        </a>
      </div>
    </header>

    <main id="main">
      <section class="hero">
        <div class="wrap">
          <p class="review-back"><a href="../">Crew Lab</a></p>
          <p class="eyebrow">WingsCrew</p>
          <h1>T-shirt review</h1>
          <p class="tagline">Hot or not</p>
          <p class="lede">
            One design at a time. Yes, no, and notes stay on this phone until you copy or email them.
          </p>
        </div>
      </section>

      <section class="section" aria-labelledby="design-heading">
        <div class="wrap">
          <h2 class="sr-only" id="design-heading">Designs</h2>
          <div data-tshirt-review></div>
          <noscript>
            <p class="empty">JavaScript is off, so the review tool is hidden.</p>
          </noscript>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <p>WingsCrew · windigo98</p>
        <p>© 2026 WingsCrew. All rights reserved.</p>
      </div>
    </footer>

    <script src="../../assets/tshirt-designs.js"></script>
    <script src="../../assets/tshirt-review.js"></script>
  </body>
</html>
