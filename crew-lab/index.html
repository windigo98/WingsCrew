<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Crew Lab</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Unlisted WingsCrew page for in-progress lab apps."
    />
    <meta name="theme-color" content="#0b0a09" />
    <link rel="icon" href="../assets/brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/brand/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/brand/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,560;0,9..144,650;1,9..144,560&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/styles.css" />
  </head>
  <body class="lab">
    <a class="skip" href="#main">Skip to content</a>
    <header class="site-header" id="top">
      <div class="wrap bar">
        <a class="brand" href="https://wingscrew.com/" aria-label="WingsCrew home">
          <picture>
            <source srcset="../assets/brand/logo.webp" type="image/webp" />
            <img
              class="brand-logo"
              src="../assets/brand/logo.png"
              width="532"
              height="720"
              alt="WingsCrew"
            />
          </picture>
          <span aria-hidden="true">WingsCrew</span>
        </a>
      </div>
    </header>

    <main id="main">
      <section class="hero">
        <div class="wrap">
          <p class="eyebrow">WingsCrew</p>
          <h1>Crew Lab</h1>
          <p class="tagline">In progress</p>
          <p class="lede">Lab apps that are not ready for the public home page.</p>
        </div>
      </section>

      <section class="section" id="progress" aria-labelledby="progress-title">
        <div class="wrap">
          <h2 class="section-title" id="progress-title">
            <span class="dash" aria-hidden="true">—</span> In progress
          </h2>
          <div class="apps-grid" data-lab="progress"></div>
          <noscript>
            <p class="empty">
              JavaScript is off, so the lab list is hidden. You can still open
              <a href="/crew-lab/tshirt-review/">T-shirt review</a>,
              <a href="/highkeep-preview/">Highkeep</a>,
              and
              <a href="/wtb-clarity-preview/">WTB Clarity 2plat</a>.
            </p>
          </noscript>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <p><a href="https://wingscrew.com/">WingsCrew</a> · windigo98</p>
        <p><a href="/about/">About</a></p>
        <p class="social-links" data-social="footer" hidden></p>
        <p>© 2026 <a href="https://wingscrew.com/">WingsCrew</a>. All rights reserved.</p>
      </div>
    </footer>

    <a class="crew-lab-mark" href="/" aria-label="Back"></a>

    <script src="../assets/social.js"></script>
    <script src="../assets/lab-apps.js"></script>
    <script src="../assets/lab.js"></script>
  </body>
</html>
