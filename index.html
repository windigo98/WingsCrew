<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WingsCrew — apps &amp; more</title>
    <meta
      name="description"
      content="Live apps from windigo98. WingsCrew is a phone-first home for Sip &amp; Spill, Net Pulse, and the shop."
    />
    <meta name="theme-color" content="#0b0a09" />
    <link rel="canonical" href="https://windigo98.github.io/WingsCrew/" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,560;0,9..144,650;1,9..144,560&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
    <meta property="og:title" content="WingsCrew — apps &amp; more" />
    <meta
      property="og:description"
      content="Live apps from windigo98. The shop opens when the merch is ready."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://windigo98.github.io/WingsCrew/" />
  </head>
  <body>
    <a class="skip" href="#apps">Skip to apps</a>
    <header class="site-header" id="top">
      <div class="wrap bar">
        <a class="brand" href="#top">
          <img src="assets/icon.svg" width="28" height="28" alt="" />
          <span>WingsCrew</span>
        </a>
        <nav class="nav" aria-label="Primary">
          <a href="#apps">Apps</a>
          <a href="#shop">Shop</a>
          <button
            class="share"
            type="button"
            data-share
            aria-label="Share WingsCrew"
          >
            Share
          </button>
          <a
            class="tip"
            href="https://cash.app/$windigo98"
            target="_blank"
            rel="noopener noreferrer"
            >Tip<span class="sr-only"> on Cash App</span></a
          >
        </nav>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="wrap">
          <div class="hero-top">
            <div class="hero-copy">
              <p class="eyebrow">A shop by windigo98</p>
              <h1>WingsCrew</h1>
              <p class="tagline">apps &amp; more</p>
            </div>
            <div class="hero-mark">
              <img src="assets/mark.svg" width="340" height="170" alt="" />
            </div>
          </div>
          <p class="lede">
            Live apps from windigo98. The shop opens when the merch is ready.
          </p>
          <div class="hero-actions">
            <a class="see-apps" href="#apps">See the apps</a>
            <button
              class="share"
              type="button"
              data-share
              aria-label="Share WingsCrew"
            >
              Share
            </button>
          </div>
        </div>
      </section>

      <section class="section" id="apps" aria-labelledby="apps-title">
        <div class="wrap">
          <h2 class="section-title" id="apps-title">
            <span class="dash" aria-hidden="true">—</span> Apps
          </h2>
          <div class="apps-grid" data-apps></div>
          <noscript>
            <p class="empty">
              JavaScript is off, so the live list is hidden. You can still open
              <a href="https://windigo98.github.io/Sip-and-Spill/">Sip &amp; Spill</a>
              and
              <a href="https://windigo98.github.io/Net-pulse/">Net Pulse</a>.
            </p>
          </noscript>
        </div>
      </section>

      <section class="section" id="shop" aria-labelledby="shop-title">
        <div class="wrap">
          <h2 class="section-title" id="shop-title">
            <span class="dash" aria-hidden="true">—</span> Shop
          </h2>
          <article class="panel shop-card">
            <p class="badge">Merch</p>
            <h3>Coming soon</h3>
            <p class="blurb">
              The shop opens when the merch is ready. Nothing is for sale yet.
            </p>
          </article>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <p>WingsCrew · windigo98</p>
      </div>
    </footer>

    <script src="assets/apps.js"></script>
    <script src="assets/site.js"></script>
  </body>
</html>
